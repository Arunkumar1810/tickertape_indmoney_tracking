# Declarative Manifest for Modular Stock Portfolio & Analysis Framework
# Enforces Strict 1-to-Many Account Partitioning across Investment Ways

version: "1.0"

accounts:
  angelone:
    broker: "angelone"
    currency: "INR"
    skill: "fetch-angelone"
    description: "Angel One Indian Demat & Trading Account (NSE/BSE)"
    active: true
  indmoney_us:
    broker: "indmoney"
    currency: "USD"
    skill: "fetch-indmoney-us"
    description: "INDmoney / DriveWealth US Equities Account (NYSE/NASDAQ)"
    active: true

data_providers:
  provider-tickertape:
    skill: "provider-tickertape"
    markets: ["IN", "US"]
    description: "Tickertape Pro Financial Statements & Valuation Metrics Provider"

gatekeepers:
  agent-schilit:
    skill: "agent-schilit"
    description: "Howard Schilit Forensic Accounting & Corporate Governance Veto Gatekeeper"
  forensic-governance:
    skill: "agent-schilit"
    description: "Howard Schilit Forensic Accounting & Corporate Governance Veto Filter (Alias to agent-schilit)"

analysis_principles:
  agent-graham:
    skill: "agent-graham"
    category: "deep_value"
    description: "Benjamin Graham Net-Net Working Capital & Graham Number Floor"
  analyze-graham:
    skill: "agent-graham"
    category: "deep_value"
    description: "Benjamin Graham Net-Net Working Capital & Graham Number Floor (Alias to agent-graham)"
  agent-lynch:
    skill: "agent-lynch"
    category: "garp"
    description: "Peter Lynch PEG Ratio, Stock Categorization & Inventory Velocity"
  analyze-lynch:
    skill: "agent-lynch"
    category: "garp"
    description: "Peter Lynch PEG Ratio, Stock Categorization & Inventory Velocity (Alias to agent-lynch)"
  agent-buffet:
    skill: "agent-buffet"
    category: "compounding_moat"
    description: "Warren Buffett Owner Earnings, 5-Step DuPont ROE & ROIC Moat"
  agent-klarman:
    skill: "agent-klarman"
    category: "solvency_stress"
    description: "Seth Klarman Altman Z-Score, Debt Maturity Wall & Liquidation Stress"
  analyze-klarman-solvency:
    skill: "agent-klarman"
    category: "solvency_stress"
    description: "Seth Klarman Altman Z-Score, Debt Maturity Wall & Liquidation Stress (Alias to agent-klarman)"

investment_ways:
  fundamental_lts:
    title: "Fundamental Long-Term Stocks (India)"
    skill: "way-long-term-strategy"
    base_currency: "INR"
    accounts: ["angelone"]
    data_provider: "provider-tickertape"
    gatekeepers: ["forensic-governance"]
    analysis_principles:
      - "analyze-graham"
      - "analyze-lynch"
      - "agent-buffet"
      - "analyze-klarman-solvency"
    weights:
      analyze-graham: 0.25
      analyze-lynch: 0.25
      agent-buffet: 0.30
      analyze-klarman-solvency: 0.20

  fundamental_foreign:
    title: "Fundamental Foreign Stocks (US)"
    skill: "way-foreign-strategy"
    base_currency: "USD"
    accounts: ["indmoney_us"]
    data_provider: "provider-tickertape"
    gatekeepers: ["forensic-governance"]
    analysis_principles:
      - "analyze-graham"
      - "analyze-lynch"
      - "agent-buffet"
      - "analyze-klarman-solvency"
    weights:
      analyze-graham: 0.20
      analyze-lynch: 0.25
      agent-buffet: 0.35
      analyze-klarman-solvency: 0.20

